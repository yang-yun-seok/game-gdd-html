name: Bug Report
description: 재현 가능한 오류, 잘못된 라우팅 또는 HTML 검증 문제를 신고합니다.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        신고해 주셔서 감사합니다. 비밀정보와 비공개 프로젝트 내용은 제거해 주세요.

  - type: checkboxes
    id: preflight
    attributes:
      label: 사전 확인
      options:
        - label: README와 기존 Issue를 확인했습니다.
          required: true
        - label: 공개해도 되는 최소 재현 입력만 포함했습니다.
          required: true
        - label: 보안 취약점 신고가 아닙니다.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: 문제 영역
      options:
        - 자연어 요청 해석
        - GDDQL 파싱
        - profile 또는 document kind 라우팅
        - 범위·facet·section 선택
        - JSON 작성 계약
        - HTML 렌더링
        - HTML 검증
        - 문서·설치
        - 기타
    validations:
      required: true

  - type: textarea
    id: request
    attributes:
      label: 최소 재현 입력
      description: 문제가 발생하는 자연어 요청 또는 GDDQL을 입력해 주세요.
      render: text
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 단계
      description: 실행한 명령과 순서를 번호로 작성해 주세요.
      placeholder: |
        1. python scripts/interpret_request.py ...
        2. 출력 JSON을 확인합니다.
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 운영체제
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python 버전
      placeholder: Python 3.10.6
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: 버전 또는 커밋
      placeholder: v0.1.0 또는 c8b91f8
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: 검증기·테스트 출력
      description: 관련 출력이 있다면 붙여 넣어 주세요.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: 추가 맥락
      description: 스크린샷, 관련 문서 종류와 참고 링크를 추가할 수 있습니다.
