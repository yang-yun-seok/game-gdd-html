name: Document Kind Request
description: 새로운 세부 게임 기획서 종류를 제안합니다.
title: "[Kind]: "
labels:
  - enhancement
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        새로운 kind는 기존 문서와 제목만 달라서는 안 됩니다. 고유한 결정 목적, 소유 범위, 제외 범위와 핸드오프가 필요합니다.

  - type: input
    id: label
    attributes:
      label: 제안 문서명
      placeholder: 길드 시스템 기획서
    validations:
      required: true

  - type: input
    id: kind
    attributes:
      label: 제안 canonical kind
      description: 영문 소문자와 하이픈을 사용합니다.
      placeholder: guild-system
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 카테고리
      options:
        - 프로젝트 전체 기획
        - 시스템 기획
        - 전투 기획
        - 레벨·콘텐츠 기획
        - 경제·밸런스 기획
        - UI·UX 기획
        - 세계관·스토리 기획
        - 데이터·기술 협업 기획
        - 운영·마케팅 기획
    validations:
      required: true

  - type: textarea
    id: reader
    attributes:
      label: 독자와 결정 목적
      description: 누가 어떤 결정을 내리기 위해 사용하는 문서인지 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: ownership
    attributes:
      label: 문서가 소유할 범위
      description: 이 문서가 확정해야 하는 규칙과 산출물을 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: excludes
    attributes:
      label: 명시적 제외 범위
      description: 인접 문서에 맡겨야 할 내용을 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: outputs
    attributes:
      label: 필수 산출물
      description: 완료된 문서에 반드시 있어야 하는 결과를 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: handoffs
    attributes:
      label: 인접 문서와 핸드오프
      description: 입력으로 참조할 문서와 결과를 전달할 문서를 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: requests
    attributes:
      label: 대표 자연어 요청
      description: 이 kind로 라우팅되어야 하는 표현을 2개 이상 적어 주세요.
      placeholder: |
        - 길드 가입과 탈퇴 규칙을 정의하는 길드 시스템 기획서
        - 길드 권한과 추방 예외를 포함한 기획서
    validations:
      required: true

  - type: textarea
    id: distinction
    attributes:
      label: 기존 kind와의 차이
      description: 가장 가까운 기존 문서와 합치지 않아야 하는 이유를 설명해 주세요.
    validations:
      required: true
