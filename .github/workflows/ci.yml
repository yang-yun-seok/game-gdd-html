name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate skill manifest
        run: python tools/validate_skill.py skill/game-gdd-html

      - name: Test request interpreter
        run: python tests/test_interpreter.py

      - name: Test compact context compiler
        run: python tests/test_context_compiler.py

      - name: Test document kinds
        run: python tests/test_kinds.py

      - name: Test document profiles
        run: python tests/test_profiles.py

      - name: Test one-page PDF exporter
        run: node skill/game-gdd-html/scripts/export_pdf.cjs --self-test
